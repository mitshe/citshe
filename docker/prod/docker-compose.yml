# Production stack for citshe — Postgres-backed, fronted by a Cloudflare Tunnel.
#
# Nothing is published to the host: the web app is reachable only through the
# cloudflared tunnel (your PANEL_DOMAIN), so the VPS keeps every port but SSH
# closed. Put PANEL_DOMAIN / POSTGRES_PASSWORD / ENCRYPTION_KEY / JWT_SECRET /
# TUNNEL_TOKEN in an .env next to this file (chmod 600). See .env.example.
#
#   docker compose -f docker/prod/docker-compose.yml --env-file .env pull
#   docker compose -f docker/prod/docker-compose.yml --env-file .env up -d
#
# Images are pulled from GHCR by default (IMAGE_TAG defaults to :latest). To
# build from source instead, run with `--build` (the build: contexts are kept).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: citshe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: citshe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citshe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [citshe]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [citshe]

  api:
    image: ghcr.io/mitshe/citshe-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://citshe:${POSTGRES_PASSWORD}@postgres:5432/citshe?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The panel is same-origin behind the tunnel, so these all point at it.
      ALLOWED_ORIGINS: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      CORS_ORIGINS: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      APP_URL: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      API_BASE_URL: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      # The executor image the API spawns for terminals/workers.
      EXECUTOR_IMAGE: ghcr.io/mitshe/citshe-executor:${EXECUTOR_TAG:-latest}
    # The API spawns executor containers via the Docker socket.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [citshe]

  web:
    image: ghcr.io/mitshe/citshe-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The browser calls /api/v1 same-origin; Next proxies it to the API here.
      BACKEND_URL: http://api:3001
      NEXT_PUBLIC_APP_URL: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      # WebSocket is client-side, so it must be the public panel URL.
      NEXT_PUBLIC_WS_URL: wss://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
    depends_on:
      - api
    networks: [citshe]

  # Edge reverse-proxy. The Cloudflare Tunnel forwards to this single origin,
  # and it splits traffic: /socket.io/* (terminals + live status, WebSockets)
  # goes to the API, everything else to the Next.js web app. Caddy proxies
  # WebSockets natively, which the tunnel-to-web path could not do.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - web
      - api
    networks: [citshe]

  # Cloudflare Tunnel — the only ingress. No host ports are published; the
  # tunnel connects outbound to Cloudflare and forwards to the proxy. Set
  # TUNNEL_TOKEN from the tunnel you create in the Cloudflare dashboard, and
  # point its public hostname (your PANEL_DOMAIN) at http://proxy:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}"]
    depends_on:
      - proxy
    networks: [citshe]

configs:
  caddyfile:
    content: |
      :80 {
      	# Terminals + live status ride socket.io on the API.
      	@ws path /socket.io/*
      	reverse_proxy @ws api:3001
      	# Everything else is the Next.js app (which itself proxies /api/v1 + /auth).
      	reverse_proxy web:3000
      }

volumes:
  postgres-data:
  redis-data:

networks:
  citshe:
    driver: bridge
